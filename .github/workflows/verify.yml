name: verify

on:
  push:
  pull_request:

jobs:
  finite-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show Python version
        run: python --version
      - name: Run finite certificate verification
        run: bash scripts/run_all_verification.sh
