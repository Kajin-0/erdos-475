name: verify

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finite-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show Python version
        run: python --version
      - name: Run Python finite certificate verification
        run: bash scripts/run_all_verification.sh

  residue-audit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate verified domain JSON
        run: python -m json.tool certificates/verified_domains.json > /dev/null
      - name: Run finite residue audit smoke check
        run: |
          python scripts/reduction_residue_audit.py \
            --max-prime 31 \
            --cover-verified-domain \
            | tee residue_audit_smoke.log
          grep -q "residue_not_verified=0" residue_audit_smoke.log
          grep -q "VERDICT: residue is contained in verified finite domain" residue_audit_smoke.log
      - name: Run coverage sandwich sweep smoke check
        run: |
          python scripts/sweep_coverage_sandwich.py \
            --max-prime 31 \
            --include-default-rules \
            --include-verified-domain \
            --alphas 0.10 \
            --n-mins 13 \
            --p-mins 37 \
            --cs 0.05 \
            --large-p-mins 37 \
            | tee coverage_sweep_smoke.log
          grep -q "tested=1" coverage_sweep_smoke.log
      - name: Run insertion analyzer smoke check
        run: |
          python scripts/analyze_insertion_blocks.py \
            --p 5 \
            --order 1,2 \
            --x 3 \
            | tee insertion_analyzer_smoke.log
          grep -q "blocked_count=" insertion_analyzer_smoke.log
          grep -q "unblocked_count=" insertion_analyzer_smoke.log
      - name: Run insertion reordering search smoke check
        run: |
          python scripts/search_insertion_reorderings.py \
            --p 5 \
            --values 1,2 \
            --x 3 \
            --random-trials 2 \
            --local-rounds 1 \
            | tee insertion_reordering_smoke.log
          grep -q "tasks=1" insertion_reordering_smoke.log
          grep -q "valid_order_found=" insertion_reordering_smoke.log
      - name: Run small counterexample search smoke check
        run: |
          python scripts/search_small_counterexamples.py \
            --max-prime 7 \
            --t-range 1..4 \
            --canonical-only \
            | tee small_counterexample_smoke.log
          grep -q "VERDICT: no counterexamples found" small_counterexample_smoke.log

  rust-independent-verifier:
    runs-on: ubuntu-latest
    needs: finite-certificate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust independent verifier
        run: |
          if [[ ! -f certificates/minimal_witnesses.jsonl ]]; then
            echo "certificates/minimal_witnesses.jsonl not present; skipping Rust verifier"
            exit 0
          fi
          if [[ ! -f certificates/witnesses_p29_b08.jsonl ]]; then
            echo "certificates/witnesses_p29_b08.jsonl not present; p29 b8 shard is required"
            exit 2
          fi
          cd rust-verifier
          cargo run --release -- \
            ../certificates/minimal_witnesses.jsonl \
            ../certificates/witnesses_p29_b08.jsonl \
            --domain 17:3 \
            --domain 19:3-5 \
            --domain 23:3-9 \
            --domain 29:3-8 \
            --domain 31:3-6 \
            --require-canonical \
            --require-coverage
