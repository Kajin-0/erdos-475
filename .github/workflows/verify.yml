name: verify

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finite-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            if [[ "$before_sha" =~ ^0+$ ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$head_sha")"
            else
              changed_files="$(git diff --name-only "$before_sha" "$head_sha")"
            fi
          else
            changed_files="__manual_full_verify__"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          source scripts/ci_classify.sh
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
      - name: Show Python version
        if: steps.changes.outputs.docs_only != 'true'
        run: python --version
      - name: Install test runner
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m pip install pytest
      - name: Strict release gate
        if: steps.changes.outputs.docs_only != 'true'
        run: STRICT_CERT=1 bash scripts/run_all_verification.sh
      - name: Validate certificate JSON schema (independent duplicate)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python scripts/validate_certificate_schema.py \
            --strict certificates/minimal_witnesses.jsonl \
            certificates/witnesses_p29_b08.jsonl
      - name: Validate verified_domains.json schema
        if: steps.changes.outputs.docs_only != 'true'
        run: python scripts/validate_certificate_schema.py --domains certificates/verified_domains.json
      - name: Audit canonical B counts (independent duplicate)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python scripts/audit_canonical_counts.py \
            certificates/minimal_witnesses.jsonl \
            certificates/witnesses_p29_b08.jsonl \
            --domain 17:3 --domain 19:3-5 --domain 23:3-9 \
            --domain 29:3-8 --domain 31:3-6 \
            --require-canonical
      - name: Check manifest completeness
        if: steps.changes.outputs.docs_only != 'true'
        run: python scripts/check_manifest_completeness.py
      - name: Check SHA256 manifest policy coverage
        if: steps.changes.outputs.docs_only != 'true'
        run: python scripts/check_sha256_manifest_completeness.py
      - name: Check claim boundary consistency
        if: steps.changes.outputs.docs_only != 'true'
        run: python scripts/check_claim_boundary_consistency.py
      - name: Scan for unsafe overclaims
        if: steps.changes.outputs.docs_only != 'true'
        run: python scripts/check_no_overclaiming.py
      - name: Run audit regression tests
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m pytest tests/ -v
      - name: Skip finite certificate verification for docs-only change
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Low-risk docs-only change; skipping verification."

  residue-audit-smoke:
    runs-on: ubuntu-latest
    needs: finite-certificate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            if [[ "$before_sha" =~ ^0+$ ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$head_sha")"
            else
              changed_files="$(git diff --name-only "$before_sha" "$head_sha")"
            fi
          else
            changed_files="__manual_full_verify__"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          source scripts/ci_classify.sh
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.12"
      - name: Validate verified domain JSON
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m json.tool certificates/verified_domains.json > /dev/null
      - name: Run finite residue audit smoke check
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python scripts/reduction_residue_audit.py \
            --max-prime 31 \
            --cover-verified-domain \
            | tee residue_audit_smoke.log
          grep -q "residue_not_verified=0" residue_audit_smoke.log
          grep -q "VERDICT: residue is contained in verified finite domain" residue_audit_smoke.log
      - name: Run coverage sandwich sweep smoke check
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python scripts/sweep_coverage_sandwich.py \
            --max-prime 31 \
            --include-default-rules \
            --include-verified-domain \
            --alphas 0.10 \
            --n-mins 13 \
            --p-mins 37 \
            --cs 0.05 \
            --large-p-mins 37 \
            | tee coverage_sweep_smoke.log
          grep -q "tested=1" coverage_sweep_smoke.log
      - name: Run insertion analyzer smoke check
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python scripts/analyze_insertion_blocks.py \
            --p 5 \
            --order 1,2 \
            --x 3 \
            | tee insertion_analyzer_smoke.log
          grep -q "blocked_count=" insertion_analyzer_smoke.log
          grep -q "unblocked_count=" insertion_analyzer_smoke.log
      - name: Run insertion reordering search smoke check
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python scripts/search_insertion_reorderings.py \
            --p 5 \
            --values 1,2 \
            --x 3 \
            --random-trials 2 \
            --local-rounds 1 \
            | tee insertion_reordering_smoke.log
          grep -q "tasks=1" insertion_reordering_smoke.log
          grep -q "valid_order_found=" insertion_reordering_smoke.log
      - name: Run small counterexample search smoke check
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python scripts/search_small_counterexamples.py \
            --max-prime 7 \
            --t-range 1..4 \
            --canonical-only \
            | tee small_counterexample_smoke.log
          grep -q "VERDICT: no counterexamples found" small_counterexample_smoke.log
      - name: Skip residue audit smoke checks for docs-only change
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Low-risk docs-only change; skipping residue-audit smoke checks."

  rust-independent-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            before_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            if [[ "$before_sha" =~ ^0+$ ]]; then
              changed_files="$(git diff-tree --no-commit-id --name-only -r "$head_sha")"
            else
              changed_files="$(git diff --name-only "$before_sha" "$head_sha")"
            fi
          else
            changed_files="__manual_full_verify__"
          fi

          echo "Changed files:"
          printf '%s\n' "$changed_files"

          source scripts/ci_classify.sh
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.docs_only != 'true'
      - name: Run Rust independent verifier
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          if [[ ! -f certificates/minimal_witnesses.jsonl ]]; then
            echo "certificates/minimal_witnesses.jsonl not present; skipping Rust verifier"
            exit 0
          fi
          if [[ ! -f certificates/witnesses_p29_b08.jsonl ]]; then
            echo "certificates/witnesses_p29_b08.jsonl not present; p29 b8 shard is required"
            exit 2
          fi
          cd rust-verifier
          cargo run --release -- \
            ../certificates/minimal_witnesses.jsonl \
            ../certificates/witnesses_p29_b08.jsonl \
            --domain 17:3 \
            --domain 19:3-5 \
            --domain 23:3-9 \
            --domain 29:3-8 \
            --domain 31:3-6 \
            --require-canonical \
            --require-coverage
      - name: Skip Rust verifier for docs-only change
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Low-risk docs-only change; skipping Rust independent verifier."
