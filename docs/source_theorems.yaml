- source_id: costa_dellafiore_2026_cyclic_weak_sequenceability
  authors: "Simone Costa; Stefano Della Fiore"
  title: "New bounds for (weak) sequenceability in Z_k"
  arxiv_or_publication: "arXiv:2602.19989"
  theorem_number: "Abstract-level extraction pending PDF audit"
  exact_statement: "Let k be a positive integer and let p be the least prime divisor of k. For cyclic groups Z_k, the authors improve the known sequenceability bound to |A| <= exp(c(log p)^{1/3}) for some constant c>0. They also obtain t-weak sequenceability whenever t <= exp(c(log p)^{1/4}) by imposing local constraints at once and applying the Lovasz Local Lemma."
