- source_id: pham_sauermann_2026_large_prime
  authors: "Huy Tuan Pham; Lisa Sauermann"
  title: "On Graham's rearrangement conjecture"
  arxiv_or_publication: "arXiv:2602.15797"
  theorem_number: "pending PDF/TeX extraction"
  exact_statement: "For any alpha in (0,1), the conjecture holds for |S| <= p^{1-alpha} when |S| is sufficiently large with respect to alpha. Combined with earlier results, this gives a complete resolution for all sufficiently large primes p."
  prime_hypotheses: "p sufficiently large (P_alpha depends on alpha)"
  set_size_hypotheses: "N_alpha <= t <= p^{1-alpha}"
  exceptional_cases: "N_alpha and P_alpha are not extracted; dependence on alpha is abstract"
  constants_or_thresholds: "thresholds N_alpha, P_alpha pending extraction"
  effective_status: "non_effective"
  translation_to_p_t: "N_alpha <= t <= floor(p^{1-alpha}) for p >= P_alpha"
  translation_to_p_b: "p-1-floor(p^{1-alpha}) <= |B| <= p-1-N_alpha for p >= P_alpha"
  audit_rule_status: "exploratory_flag: --cover-medium-alpha"
  citation: "Pham, Huy Tuan; Sauermann, Lisa (2026). arXiv:2602.15797."
  notes: "Non-effective threshold. N_alpha and P_alpha must be extracted from paper before this can be used in proof-level audit. The abstract states the theorem is asymptotic and uses 'sufficiently large' non-effectively."

