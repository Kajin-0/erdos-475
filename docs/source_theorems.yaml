- source_id: bedert_kravitz_2024_small_prime_field_sets
  authors: "Benjamin Bedert; Noah Kravitz"
  title: "Graham's rearrangement conjecture beyond the rectification barrier"
  arxiv_or_publication: "arXiv:2409.07403"
  theorem_number: "Theorem 1.2"
  exact_statement: "For every constant c>0, let p be a large prime. Then every subset A ⊆ F_p \ {0} of size |A| <= exp(c(log p)^{1/4}) has a valid ordering."
  prime_hypotheses: "p large prime (threshold not specified)"
  set_size_hypotheses: "|A| <= exp(c(log p)^{1/4}) for any fixed c>0"
  exceptional_cases: "none stated for sufficiently large p"
  constants_or_thresholds: "c>0 arbitrary; endpoint = floor(exp(c(log p)^{0.25}))"
  effective_status: "non_effective"
  translation_to_p_t: "t <= floor(exp(c(log p)^{0.25})) for sufficiently large p"
  translation_to_p_b: "|B| >= p - 1 - floor(exp(c(log p)^{0.25})) for sufficiently large p"
  audit_rule_status: "exploratory_flag: --cover-small-exp-quarter"
  citation: "Bedert, Benjamin; Kravitz, Noah (2024). arXiv:2409.07403."
  notes: "Non-effective: the large-prime condition 'p sufficiently large' is not made explicit. The abstract states the bound without the c>0 parameter (|A| <= exp((log p)^{1/4})), but Theorem 1.2 in the body introduces an arbitrary c>0 and the 'large prime' qualifier. Do not use in proof-level audit until the large-prime threshold is extracted."

- source_id: pham_sauermann_2026_large_prime
  authors: "Huy Tuan Pham; Lisa Sauermann"
  title: "On Graham's rearrangement conjecture"
  arxiv_or_publication: "arXiv:2602.15797"
  theorem_number: "Theorem 1.2"
  exact_statement: "For any 0<alpha<1, there exists a constant C_alpha>0 such that: Let p be a prime and let S ⊆ Z_p \ {0} with C_alpha <= |S| <= p^{1-alpha}. Then there exists a valid ordering of S. Combined with earlier results, this gives a complete resolution for all sufficiently large primes p."
  prime_hypotheses: "p prime (no explicit threshold; 'sufficiently large' for the complete resolution claim)"
  set_size_hypotheses: "C_alpha <= t <= p^{1-alpha}"
  exceptional_cases: "C_alpha depends on alpha in a non-explicit way"
  constants_or_thresholds: "C_alpha (existential, depends on alpha); P_0 for 'sufficiently large p' (not specified)"
  effective_status: "non_effective"
  translation_to_p_t: "C_alpha <= t <= floor(p^{1-alpha}) for p >= P_0"
  translation_to_p_b: "p-1-floor(p^{1-alpha}) <= |B| <= p-1-C_alpha for p >= P_0"
  audit_rule_status: "exploratory_flag: --cover-medium-alpha"
  citation: "Pham, Huy Tuan; Sauermann, Lisa (2026). arXiv:2602.15797."
  notes: "Non-effective threshold. C_alpha and P_0 not extracted from paper body. Paper also proves an anticoncentration result (Theorem 1.3) with explicit constant C=2^24, but this is an ingredient for Theorem 1.2, not the main theorem itself."

